<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#F7F2EA">
  <title>Categories & collections · Aurelle Studio</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="assets/tailwind-config.js"></script>
  <link rel="stylesheet" href="assets/styles.css">
</head>
<body class="min-h-screen bg-ivory text-espresso antialiased" data-page="categories">
  <div id="app-shell">
    <main id="page-content">
      <section class="mx-auto w-full max-w-[1500px] p-4 pb-28 sm:p-6 lg:p-8 lg:pb-8">
        <header class="mb-6 flex flex-col gap-4 sm:flex-row sm:items-end sm:justify-between">
          <div>
            <p class="mb-2 text-xs font-semibold uppercase tracking-[.18em] text-espresso/50">Catalogue / Organisation</p>
            <h1 class="font-display text-4xl font-semibold sm:text-5xl">Categories & collections</h1>
            <p class="mt-2 max-w-2xl text-sm leading-6 text-espresso/60">Give every piece a place, and every collection a story.</p>
          </div>
          <button id="add-category" class="btn-primary" type="button">＋ Add category</button>
        </header>

        <div class="mb-6 flex gap-2 border-b border-espresso/10" role="tablist" aria-label="Catalogue organisation">
          <button class="filter-tab is-active" id="tab-categories" data-tab="categories" role="tab" aria-selected="true" type="button">Categories</button>
          <button class="filter-tab" id="tab-collections" data-tab="collections" role="tab" aria-selected="false" type="button">Collections</button>
        </div>

        <div id="category-view">
          <div class="mb-4 grid grid-cols-1 gap-3 sm:grid-cols-3" id="category-stats"></div>
          <section class="panel overflow-hidden">
            <div class="flex flex-col gap-3 border-b border-espresso/10 p-4 sm:flex-row sm:items-center sm:justify-between sm:p-5">
              <div>
                <h2 class="section-title">Your categories</h2>
                <p class="section-subtitle">Drag rows to change their display order.</p>
              </div>
              <label class="field-wrap sm:max-w-xs">
                <span class="field-icon" aria-hidden="true">⌕</span>
                <input id="category-search" class="field-input pl-10" type="search" placeholder="Search categories…">
              </label>
            </div>
            <div id="category-list" class="divide-y divide-espresso/10" aria-live="polite"></div>
          </section>
        </div>

        <div id="collection-view" class="hidden">
          <div class="mb-4 grid grid-cols-1 gap-3 sm:grid-cols-3" id="collection-stats"></div>
          <section class="panel overflow-hidden">
            <div class="flex flex-col gap-3 border-b border-espresso/10 p-4 sm:flex-row sm:items-center sm:justify-between sm:p-5">
              <div>
                <h2 class="section-title">Curated collections</h2>
                <p class="section-subtitle">Group products into seasonal edits and featured stories.</p>
              </div>
              <button id="add-collection" class="btn-primary" type="button">＋ New collection</button>
            </div>
            <div id="collection-list" class="grid grid-cols-1 gap-4 p-4 sm:grid-cols-2 xl:grid-cols-3"></div>
          </section>
        </div>
      </section>
    </main>
  </div>

  <script src="assets/data.js"></script>
  <script src="assets/store.js"></script>
  <script src="assets/auth.js"></script>
  <script src="assets/ui.js"></script>
  <script src="assets/layout.js"></script>
  <script src="assets/pages/categories.js"></script>
</body>
</html>
